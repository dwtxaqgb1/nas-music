map $http_x_frontend_auth $auth_header {
    default $http_x_frontend_auth;
    "" "Dwt645830";
}

server {
    listen 80;
    server_name _;

    location = / {
        proxy_pass http://nas-music-download:9527/index.html;
        proxy_set_header x-frontend-auth $auth_header;
    }

    location = /api/admin/password {
        proxy_pass http://nas-music-download-sidecar:3001;
        proxy_set_header Content-Type application/json;
    }

    location = /set_playmode {
        default_type application/json;
        proxy_pass http://host.docker.internal:8773/set_playmode;
    }
    location = /get_playmode {
        default_type application/json;
        proxy_pass http://host.docker.internal:8773/get_playmode;
    }
    location = /fetch-source {
        default_type application/json;
        proxy_pass http://host.docker.internal:8773/fetch-source;
    }
    location = /extract-zip {
        default_type application/json;
        proxy_pass http://host.docker.internal:8773/extract-zip;
    }
    location = /search-sources {
        default_type application/json;
        proxy_pass http://host.docker.internal:8773/search-sources;
    }
    location = /save-source {
        default_type application/json;
        proxy_pass http://host.docker.internal:8773/save-source;
    }
    location = /get-mirror {
        default_type application/json;
        proxy_pass http://host.docker.internal:8773/get-mirror;
    }
    location = /set-mirror {
        default_type application/json;
        proxy_pass http://host.docker.internal:8773/set-mirror;
    }


    location = /list-saved {
        default_type application/json;
        proxy_pass http://host.docker.internal:8773/list-saved;
    }
    location = /peek-saved {
        default_type application/json;
        proxy_pass http://host.docker.internal:8773/peek-saved;
    }
    location = /export-source {
        default_type application/json;
        proxy_pass http://host.docker.internal:8773/export-source;
    }
    location = /delete-saved {
        default_type application/json;
        proxy_pass http://host.docker.internal:8773/delete-saved;
    }
    location = /download-saved {
        default_type application/json;
        proxy_pass http://host.docker.internal:8773/download-saved;
    }
    location = /set-token {
        default_type application/json;
        proxy_pass http://host.docker.internal:8773/set-token;
    }
    location = /get-token {
        default_type application/json;
        proxy_pass http://host.docker.internal:8773/get-token;
    }
    location /cover {
        proxy_pass http://host.docker.internal:8773/cover;
    }

    location /stream/ {
        proxy_pass http://host.docker.internal:8773/stream/;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /api/v1/ {
        proxy_pass http://host.docker.internal:8773/api/v1/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://nas-music-download:9527;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header x-frontend-auth $auth_header;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
